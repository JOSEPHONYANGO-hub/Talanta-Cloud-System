kind = "web"
previewPath = "/"
title = "Talanta-Cloud EMS"
version = "1.0.0"
id = "artifacts/talanta-ems"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19610

[services.development]
run = "pnpm --filter @workspace/talanta-ems run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/talanta-ems", "run", "build" ]
publicDir = "artifacts/talanta-ems/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19610"
BASE_PATH = "/"
